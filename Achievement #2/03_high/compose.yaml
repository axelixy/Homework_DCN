name: achievement2

services:
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://numbers:numbers@db:5432/numbers
      MAX_NUMBER: ${MAX_NUMBER:-1000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: numbers
      POSTGRES_USER: numbers
      POSTGRES_PASSWORD: numbers
    volumes:
      - numbers_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numbers -d numbers"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  frontend:
  backend:
    internal: true

volumes:
  numbers_data:

name: achievement2-tests

services:
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://numbers:numbers@db:5432/numbers_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: numbers_test
      POSTGRES_USER: numbers
      POSTGRES_PASSWORD: numbers
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numbers -d numbers_test"]
      interval: 2s
      timeout: 3s
      retries: 20
